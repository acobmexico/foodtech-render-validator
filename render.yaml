services:
  - type: web
    name: foodtech-2026-ai-validator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
      - key: FOODTECH_API_BASE_URL
        sync: false
      - key: FOODTECH_API_TOKEN
        sync: false
      - key: SCORE_THRESHOLD
        value: "65"
      - key: MAX_PARALLEL_CASES
        value: "5"
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_SEARCH_MODEL
        value: gpt-5-mini
      - key: WEB_REQUEST_TIMEOUT
        value: "35"
      - key: AUTO_RUN_ON_START
        value: "false"
      - key: RESULTS_CSV_PATH
        value: /tmp/FOODTECH_VALIDACION_RESULTADOS.csv
      - key: RESULTS_XLSX_PATH
        value: /tmp/FOODTECH_VALIDACION_RESULTADOS.xlsx
      - key: ANALYSIS_CACHE_PATH
        value: /tmp/foodtech_analysis_cache.sqlite3
